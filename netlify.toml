[build]
  command = "npm run build"
  publish = "dist"
  # No se reconstruye si el cambio es solo en propuestas/ (ese es otro sitio)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)propuestas'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Seguridad: nadie puede mostrar este sitio dentro de otro (el sitio sí muestra los de los clientes)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Servicios que ya no se ofrecen: sus páginas llevan a Servicios
[[redirects]]
  from = "/servicios/asesoria-turistica/*"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/capacitacion-servicio-al-cliente/*"
  to = "/servicios/"
  status = 301
  force = true

# La galería de muestras vive ahora en Trabajos
[[redirects]]
  from = "/muestras"
  to = "/trabajos/"
  status = 301
  force = true

[[redirects]]
  from = "/muestras/"
  to = "/trabajos/"
  status = 301
  force = true
