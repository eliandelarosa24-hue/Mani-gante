<!DOCTYPE html>
<!-- Copias ocultas de los formularios que se envían por JavaScript, para que Netlify los registre en el deploy. -->
<html lang="es-CL"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
  <form name="cotizacion" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="cotizacion" />
    <input name="bot-field" />
    <input name="nombre" />
    <input name="whatsapp" />
    <input name="negocio" />
    <input name="servicios" />
    <input name="estimacion" />
    <textarea name="conversacion"></textarea>
  </form>
  <form name="diagnostico" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="diagnostico" />
    <input name="bot-field" />
    <input name="nombre" />
    <input name="whatsapp" />
    <input name="puntaje" />
    <textarea name="respuestas"></textarea>
  </form>
</body></html>
