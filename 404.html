<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antojo no encontrado · MANI-GANTE</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/icon-192.png">
<link rel="preload" href="/assets/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--color-night); color: #f4ead6; font-family: Manrope, system-ui, sans-serif; }
  .wrap { max-width: 520px; display: grid; gap: 18px; justify-items: center; }
  .bag { width: 150px; transform: rotate(-8deg); filter: drop-shadow(0 24px 30px rgba(0,0,0,.5)); }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 450; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; margin: 8px 0 0; letter-spacing: -.02em; }
  h1 em { color: var(--color-primary-light); }
  p { color: rgba(244,234,214,.72); margin: 0; }
  .sugg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
  .sugg-card { display: grid; justify-items: center; gap: 6px; padding: 14px 8px; border-radius: 18px; background: rgba(244,234,214,.06); border: 1px solid rgba(244,234,214,.12); color: #f4ead6; font-weight: 700; font-size: .86rem; text-decoration: none; height: auto; margin: 0; transition: transform .3s; }
  .sugg-card:hover { transform: translateY(-4px); }
  .sugg-card .bag { width: 60%; transform: none; filter: none; }
  .hand { font-family: Caveat, cursive; font-size: 1.6rem; color: var(--color-primary-light); transform: rotate(-3deg); }
  a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 99px; background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary)); color: var(--color-night); font-weight: 700; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
  <main class="wrap">
    <div id="art"></div>
    <p class="hand">404 · esta bolsa está vacía</p>
    <h1>Este antojo <em>no existe</em></h1>
    <p>La página que buscas no está, pero quedan 28 sabores esperándote. ¿Probamos uno de estos?</p>
    <div class="sugg" id="sugg" aria-label="Sabores sugeridos"></div>
    <a href="/#tienda">Volver a la tienda</a>
  </main>
  <script type="module">
    import { bag } from "/js/art.mjs";
    import { FLAVORS } from "/js/catalog.mjs";
    document.getElementById("art").innerHTML = bag("#C8963E", "doypack");
    const picks = FLAVORS.filter((f) => f.available).sort(() => Math.random() - .5).slice(0, 3);
    document.getElementById("sugg").innerHTML = picks.map((f) => `<a class="sugg-card" href="/sabor/${f.id}">${bag(f.color, "celofan")}<span>${f.name}</span></a>`).join("");
  </script>
</body>
</html>
